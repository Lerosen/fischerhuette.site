<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sailing Smoothly</title>
    <style>
        /* Reset und Basis-Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #94b9ff 0%, #e0e9ff 100%);
            height: 100vh;
            width: 100vw;
        }

        /* Großer Slogan */
        .slogan {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            font-size: 5rem;
            font-weight: 900;
            color: #1d3557;
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 10;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.6);
            animation: floatText 4s ease-in-out infinite;
        }

        /* Ozean-Container */
        .ocean {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45vh;
            background: #1d3557;
            overflow: hidden;
        }

        /* Animierte CSS-Wellen (Verwendung von CSS-Gradients für maximale Kompatibilität) */
        .wave {
            position: absolute;
            left: 0;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
            transform: translate3d(0, 0, 0);
        }

        /* Hintere Welle (Dunkelblau) */
        .wave1 {
            background-image: radial-gradient(circle at 50% -20px, transparent 40px, #457b9d 41px);
            background-size: 80px 100%;
            top: 0;
            animation: moveWaves 12s linear infinite;
            z-index: 1;
            opacity: 0.7;
        }

        /* Mittlere Welle (Hellblau) */
        .wave2 {
            background-image: radial-gradient(circle at 50% -15px, transparent 35px, #a8dadc 36px);
            background-size: 70px 100%;
            top: 25px;
            animation: moveWavesReverse 8s linear infinite;
            z-index: 3;
            opacity: 0.8;
        }

        /* Vordere Welle (Hauptblau) */
        .wave3 {
            background-image: radial-gradient(circle at 50% -25px, transparent 45px, #1d3557 46px);
            background-size: 90px 100%;
            top: 50px;
            animation: moveWaves 6s linear infinite;
            z-index: 5;
        }

        /* Statische Schiff-Positionen mit Bobbing-Effekt (Wippen) */
        
        /* Großes Containerschiff (Links im Hintergrund) */
        .container-ship {
            position: absolute;
            bottom: 32vh;
            left: 15%;
            width: 250px;
            height: 90px;
            z-index: 2;
            animation: bobbingShip 4s ease-in-out infinite;
        }

        .hull {
            position: absolute;
            bottom: 0;
            width: 220px;
            height: 35px;
            background: #2b2d42;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 25px;
            border-top-right-radius: 5px;
        }
        .hull::before {
            content: '';
            position: absolute;
            right: -25px;
            top: 0;
            width: 30px;
            height: 20px;
            background: #2b2d42;
            transform: skewX(40deg);
            border-top-right-radius: 5px;
        }
        .bridge {
            position: absolute;
            bottom: 35px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: #f1faee;
            border: 2px solid #2b2d42;
        }
        .cargo {
            position: absolute;
            bottom: 35px;
            left: 70px;
            width: 140px;
            height: 30px;
            background: repeating-linear-gradient(to right, #e63946, #e63946 25px, #457b9d 25px, #457b9d 50px);
            border-radius: 2px 2px 0 0;
        }

        /* Kleines rosafarbenes Segelboot (Rechts im Vordergrund) */
        .pink-boat {
            position: absolute;
            bottom: 25vh;
            right: 20%;
            width: 90px;
            height: 90px;
            z-index: 4;
            animation: bobbingBoat 3s ease-in-out infinite;
        }

        .boat-hull {
            position: absolute;
            bottom: 10px;
            width: 70px;
            height: 20px;
            background: #ffb3c6;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
        .mast {
            position: absolute;
            bottom: 30px;
            left: 35px;
            width: 4px;
            height: 55px;
            background: #b5e2fa;
        }
        .sail {
            position: absolute;
            bottom: 35px;
            left: 39px;
            width: 0;
            height: 0;
            border-left: 30px solid #ff4d6d;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
        }

        /* Animationen */
        @keyframes moveWaves {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes moveWavesReverse {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes bobbingShip {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
        }

        @keyframes bobbingBoat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(4deg); }
        }
    </style>
</head>
<body>

    <h1 class="slogan">Sailing Smoothly</h1>

    <div class="ocean">
        <!-- Welle hinten -->
        <div class="wave wave1"></div>

        <!-- Containerschiff (liegt fest verankert im Hintergrund auf Welle 1) -->
        <div class="container-ship">
            <div class="bridge"></div>
            <div class="cargo"></div>
            <div class="hull"></div>
        </div>

        <!-- Welle mitte -->
        <div class="wave wave2"></div>

        <!-- Rosa Segelboot (liegt fest verankert im Vordergrund auf Welle 2) -->
        <div class="pink-boat">
            <div class="sail"></div>
            <div class="mast"></div>
            <div class="boat-hull"></div>
        </div>

        <!-- Welle vorne -->
        <div class="wave wave3"></div>
    </div>

</body>
</html>
